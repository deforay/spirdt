services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: "${DB_NAME:-spirdt}"
      MYSQL_USER: "${DB_USER:-spirdt}"
      MYSQL_PASSWORD: "${DB_PASS:-change-me}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASS:-root}"
    ports:
      - "${DB_EXPOSED_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Migrations run immediately on boot; without this gate they race the
      # server's first-start initialisation and fail with a connection error.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASS:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
