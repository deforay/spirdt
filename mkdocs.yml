site_name: SPI-RDT Documentation
site_description: Site assessment platform for the Stepwise Process for Improving the Quality of Rapid Diagnostic Testing
site_url: https://deforay.github.io/spirdt/
repo_url: https://github.com/deforay/spirdt
repo_name: deforay/spirdt

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Install and update:
      - Installation: getting-started.md
      - Deployment: deployment.md
      - Backup and upgrade: operations.md
      - CLI reference: cli.md
  - Using the platform:
      - Conducting an audit: conducting-an-audit.md
      - Administering the platform: administering.md
      - Scoring: scoring.md
  - Technical:
      - Architecture: architecture.md
      - Data model: data-model.md
      - Templates: templates.md
      - Languages: i18n.md
      - Signatures: signatures.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deforay/spirdt
