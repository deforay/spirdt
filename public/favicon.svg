<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SPI-RDT">
    <!--
        The same mark the app wears at its top left and on the sign-in panel:
        the accent tile, and Phosphor's chart-bar in its bold weight on top of
        it. Drawn here rather than referenced, because a favicon is fetched
        before any stylesheet and cannot ask the palette for --c-accent; if
        that token ever moves, this hex moves with it.

        The glyph is a little larger inside the tile than it is on screen. At
        sixteen pixels in a browser tab there is no room for the margin that
        makes the tile look considered at forty-eight.
    -->
    <rect width="64" height="64" rx="13" fill="#2563EB" />
    <g transform="translate(14 14) scale(0.140625)" fill="#FFFFFF">
        <path d="M224,196h-4V40a12,12,0,0,0-12-12H152a12,12,0,0,0-12,12V76H96A12,12,0,0,0,84,88v36H48a12,12,0,0,0-12,12v60H32a12,12,0,0,0,0,24H224a12,12,0,0,0,0-24ZM164,52h32V196H164Zm-56,48h32v96H108ZM60,148H84v48H60Z" />
    </g>
</svg>
