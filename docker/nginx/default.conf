server {
    listen 80;
    server_name _;

    # Keep in step with docker/php/php.ini post_max_size and .env
    # UPLOAD_MAX_BYTES. See the note in php.ini.
    client_max_body_size 16M;

    # Security headers are owned SOLELY by SecurityHeadersMiddleware.
    # nginx deliberately sets none: public/ contains only the front
    # controller, so every response originates in PHP, and duplicating
    # them here emitted each header twice. One owner, one place to change.

    # ─── The API ───
    #
    # Everything under /api is PHP. The prefix is not a convention that could
    # be changed here alone: Bootstrap calls setBasePath('/api'), so Slim
    # strips exactly this much before matching a route.
    location /api {
        root /var/www/html/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/html/public;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Vite fingerprints these filenames, so a changed file is a changed URL
    # and this can be cached hard. index.html below is NOT cached — it is what
    # points at the current fingerprints.
    #
    # One header, not `expires` as well: the two are separate mechanisms that
    # both emit Cache-Control, and setting both sent it twice.
    location /assets/ {
        root /var/www/html/web/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── The assessor app ───
    #
    # A built single-page app. An unknown path is a route inside it rather
    # than a missing file, so anything unmatched falls back to index.html.
    # Without that, reloading on any screen but the first returns a 404 —
    # and a reload is exactly what someone does when a screen looks wrong.
    #
    # Serving nothing until the app has been built is deliberate. An unbuilt
    # app should fail visibly here rather than be papered over by the API's
    # JSON 404, which is what sent someone looking in the wrong place.
    location / {
        root /var/www/html/web/dist;
        try_files $uri $uri/ /index.html;
    }

    # Nothing else in the tree is executable.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
