; Upload limits must stay in step with nginx client_max_body_size and
; UPLOAD_MAX_BYTES in .env. Signature and photo uploads from the auditor
; PWA arrive in bursts after an offline visit; if these three disagree the
; failure surfaces at the edge as an opaque 413.
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 25

memory_limit = 256M
max_execution_time = 60

expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/var/log/php-error.log

date.timezone = UTC

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
